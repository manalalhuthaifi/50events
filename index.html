<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عقد عمل</title>

<style>
body{
  font-family:Tajawal;
  background:#f5f5f5;
  margin:0;
  direction:rtl;
}

.contract{
  width:794px;
  margin:auto;
  background:#fff;
  padding:20px;
}

.pdf-mode .contract{
  width:190mm;
  margin:auto;
  font-size:8px;
  line-height:1.2;
}

canvas{
  width:100%;
  height:120px;
  border:1px dashed #999;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="contract" id="contract">

<h2 style="text-align:center;">عقد عمل</h2>

<input id="employeeName" placeholder="الاسم">
<input id="employeeId" placeholder="رقم الهوية">
<input id="employeePhone" placeholder="الجوال">

<p>توقيع:</p>
<canvas id="signatureCanvas"></canvas>

<button onclick="clearSignature()">مسح</button>
<button onclick="downloadPDF()">تحميل PDF</button>
<button onclick="sendAutoEmail()">إرسال</button>

</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwD6g_0hu99nBF9FxzuEk837F_ZSiDcN5Yd9b0ggyhsSj-VFuv915FNIsDHylwWnzFA/exec";

const canvas = document.getElementById("signatureCanvas");
const ctx = canvas.getContext("2d");

let drawing=false;

function resize(){
  canvas.width=canvas.offsetWidth;
  canvas.height=120;
}
resize();

function pos(e){
  const r=canvas.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return {x:p.clientX-r.left,y:p.clientY-r.top};
}

canvas.onmousedown=e=>{
  drawing=true;
  let p=pos(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
};

canvas.onmousemove=e=>{
  if(!drawing)return;
  let p=pos(e);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
};

canvas.onmouseup=()=>drawing=false;

function clearSignature(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function downloadPDF(){
  document.body.classList.add("pdf-mode");
  setTimeout(()=>window.print(),300);
}

window.addEventListener("afterprint",()=>{
  document.body.classList.remove("pdf-mode");
});

function getSignature(){
  return canvas.toDataURL("image/png").split(",")[1];
}

async function sendAutoEmail(){

  const payload={
    employeeName:document.getElementById("employeeName").value,
    employeeId:document.getElementById("employeeId").value,
    employeePhone:document.getElementById("employeePhone").value,
    signatureBase64:getSignature()
  };

  await fetch(GOOGLE_SCRIPT_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify(payload)
  });

  alert("تم الإرسال");
}
</script>

</body>
</html>
