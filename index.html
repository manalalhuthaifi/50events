<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عقد عمل</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
  font-family:Tajawal;
  background:#f5f5f5;
  margin:0;
  direction:rtl;
}

.contract{
  width:794px;
  margin:auto;
  background:#fff;
  padding:20px;
}

/* 👇 أهم شيء لضغط الصفحة */
.pdf-mode .contract{
  transform:scale(0.82);
  transform-origin:top center;
  font-size:8px;
  line-height:1.1;
}

header{
  display:flex;
  justify-content:space-between;
  direction:ltr;
}

h2{
  text-align:center;
}

canvas{
  width:100%;
  height:120px;
  border:1px dashed #999;
  touch-action:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="contract" id="contract">

<header>
<img src="logo.jpg" width="100">
<h2>عقد عمل</h2>
<div></div>
</header>

<input id="employeeName" placeholder="الاسم">
<input id="employeeId" placeholder="الهوية">

<p>التوقيع:</p>
<canvas id="signatureCanvas"></canvas>

<button onclick="clearSignature()">مسح</button>
<button onclick="downloadPDF()">تحميل PDF</button>
<button onclick="sendAutoEmail()">إرسال تلقائي</button>

</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0vMZyhVFS5plHnskziYEzXp4v8aCWXkDIXWBegKhxnGdA-_qba3MCVNUBC4NDm3U62Q/exec";

const canvas = document.getElementById("signatureCanvas");
const ctx = canvas.getContext("2d");

let drawing=false;

function resizeCanvas(){
  canvas.width=canvas.offsetWidth;
  canvas.height=120;
}

resizeCanvas();

function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return {x:p.clientX-rect.left,y:p.clientY-rect.top};
}

function start(e){
  drawing=true;
  const p=getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
}

function move(e){
  if(!drawing)return;
  const p=getPos(e);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
}

function end(){
  drawing=false;
}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);
canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchmove",move);
canvas.addEventListener("touchend",end);

function clearSignature(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function downloadPDF(){
  document.body.classList.add("pdf-mode");

  html2pdf().from(document.getElementById("contract")).save();

  setTimeout(()=>document.body.classList.remove("pdf-mode"),1000);
}

async function sendAutoEmail(){

  document.body.classList.add("pdf-mode");

  const pdfBlob = await html2pdf()
    .from(document.getElementById("contract"))
    .outputPdf("blob");

  document.body.classList.remove("pdf-mode");

  const reader=new FileReader();

  reader.onloadend=async function(){

    const base64=reader.result.split(",")[1];

    await fetch(GOOGLE_SCRIPT_URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        employeeName:document.getElementById("employeeName").value,
        employeeId:document.getElementById("employeeId").value,
        fileName:"contract.pdf",
        pdfBase64:base64
      })
    });

    alert("تم الإرسال بنجاح 🔥");
  };

  reader.readAsDataURL(pdfBlob);
}
</script>

</body>
</html>
